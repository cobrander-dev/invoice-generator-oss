name: Release

# Manual only. Builds multi-architecture images into GHCR (visibility follows the package
# settings; new packages are private), the digest-pinned installer bundle and checksums,
# then installs that exact bundle on a clean runner. No git tag is created. A GitHub Release
# is created only as a DRAFT and only when explicitly requested.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. v1.0.0-rc.1'
        required: true
      draft_release:
        description: 'Attach assets to a DRAFT GitHub Release (never published automatically)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cobrander-dev/invoice-generator
  CADDY_IMAGE: caddy:2.11.4-alpine

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Invoice Generator

  bundle:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build digest-pinned installer bundle
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          caddy_digest="$(docker buildx imagetools inspect "$CADDY_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$caddy_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          scripts/build-installer-bundle.sh "$VERSION" "$IMAGE@$DIGEST" "$CADDY_IMAGE@$caddy_digest" dist "$GITHUB_REPOSITORY"
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
      - name: Attach to a draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/* --draft --prerelease --target "$GITHUB_SHA" --title "Invoice Generator $VERSION"

  verify:
    needs: [image, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-${{ inputs.version }}
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image covers amd64 and arm64
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          platforms="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u)"
          printf '%s\n' "$platforms"
          grep -qx linux/amd64 <<<"$platforms"
          grep -qx linux/arm64 <<<"$platforms"
      - name: Install the exact release bundle on a clean runner
        run: sudo -E tests/installer/release-smoke.sh "$GITHUB_WORKSPACE/dist"
