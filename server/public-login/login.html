<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="__CSRF_TOKEN__">
  <title>登录 · 外贸单据生成器</title>
  <link rel="stylesheet" href="/login-assets/login.css">
  <script defer src="/login-assets/login.js"></script>
</head>
<body>
  <main class="login-panel">
    <p class="eyebrow">FOREIGN TRADE DOCUMENTS</p>
    <h1>账号登录</h1>
    <p class="intro">登录后进入外贸单据系统。</p>
    <form id="login-form">
      <label for="username">用户名 / Email</label>
      <input id="username" name="username" autocomplete="username" required maxlength="128" autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
      <p id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit">登录</button>
    </form>
    <p class="phase-note">Server mode enabled.<br>登录后业务数据通过受保护API存储到SQLite。</p>
  </main>
</body>
</html>
