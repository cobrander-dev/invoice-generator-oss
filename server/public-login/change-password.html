<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 · 外贸单据生成器</title>
  <link rel="stylesheet" href="/login-assets/login.css">
  <script defer src="/login-assets/change-password.js"></script>
</head>
<body>
  <main class="login-panel">
    <p class="eyebrow">账号安全 <span class="en">Account Security</span></p>
    <h1>修改密码 <span class="en">Change Password</span></h1>
    <p class="intro">临时密码必须更换后才能进入业务系统。</p>
    <form id="change-password-form">
      <label for="current-password">当前密码 <span class="en">Current Password</span></label>
      <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required maxlength="1024">
      <label for="new-password">新密码 <span class="en">New Password</span></label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required maxlength="1024">
      <label for="confirm-password">确认新密码 <span class="en">Confirm New Password</span></label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="1024">
      <p id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit">保存新密码</button>
    </form>
  </main>
</body>
</html>
